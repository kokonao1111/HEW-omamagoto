<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おままごとキッチン画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* 展示の画面（モニターに全画面で映す）。見た目は 1 つに決めている */
  :root {
    color-scheme: dark;
    --bg: #1d1916;
    --ink: #fff8ef;
    --muted: #d9cbbb;
    --panel: rgba(28, 23, 19, 0.86);
    --line: rgba(255, 240, 220, 0.16);
    --accent: #ff8a3d;
    --accent-ink: #2a1406;
    --ok: #7fd18b;
    --warn: #ffc65c;
    --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
  #view { position: fixed; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; pointer-events: none; }
  .hud-top { top: calc(env(safe-area-inset-top, 0px) + 14px); left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 12px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
  }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill[data-s="ok"] i { background: var(--ok); }
  .pill[data-s="retry"] i { background: var(--warn); }
  .pill[data-s="demo"] i { background: var(--accent); }
  #season { font-variant-numeric: tabular-nums; }
  .toast {
    top: calc(env(safe-area-inset-top, 0px) + 60px); right: 16px; padding: 10px 16px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line); font-size: clamp(15px, 1.6vw, 22px); font-weight: 700;
    transition: opacity .25s, transform .25s;
  }
  .toast.out { opacity: 0; transform: translateY(-6px); }
  .card {
    left: 21%; top: 16%; transform: translateX(-50%); min-width: min(320px, calc(100vw - 32px)); padding: 18px 28px 20px;
    border-radius: 22px; text-align: center; background: rgba(255, 248, 239, 0.94); color: #3a2414;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35); transition: opacity .35s, transform .35s;
  }
  .card.out { opacity: 0; transform: translate(-50%, -12px); }
  @media (max-width: 700px) { .card { left: 50%; top: 10%; } }
  .card.dish { padding: 14px 22px 16px; }
  .dish-title { font-size: clamp(22px, 2.6vw, 36px); font-weight: 900; color: #d9561c; letter-spacing: 0.06em; }
  .card.dish { transition: opacity .35s, transform .35s, left .8s cubic-bezier(.5,0,.2,1), top .8s cubic-bezier(.5,0,.2,1); }
  .card.dish canvas { display: block; width: clamp(220px, 24vw, 380px); height: auto; margin: 10px auto 0; border-radius: 14px; }
  .card.dish.eat { left: 76%; top: 6%; transform: translateX(-50%) scale(0.82); }
  body[data-view="guest"] .card.dish.eat { left: 79%; top: 10%; transform: translateX(-50%) scale(0.95); }
  body[data-view="guest"] .card:not(.dish) { left: 21%; top: 12%; }
  .card.dish .wait { width: clamp(220px, 24vw, 380px); aspect-ratio: 4 / 3; margin: 10px auto 0; border-radius: 14px;
    background: linear-gradient(110deg, #efe3d3 30%, #f8efe4 50%, #efe3d3 70%) 0 0 / 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .card .score { font-size: clamp(48px, 7vw, 96px); font-weight: 900; line-height: 1; color: #d9561c; font-variant-numeric: tabular-nums; }
  .card .score small { font-size: 0.4em; margin-left: 4px; color: #3a2414; }
  .card p { margin: 10px 0 0; font-size: clamp(18px, 2.2vw, 30px); font-weight: 700; }
  .card .note { font-size: 12px; font-weight: 500; color: #8a6a52; margin-top: 6px; }
  #panel-toggle {
    position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 3;
    font: 700 13px var(--font); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  #panel {
    position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 60px); z-index: 3;
    width: min(340px, calc(100vw - 32px)); max-height: calc(100% - 140px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    display: grid; gap: 12px; backdrop-filter: blur(6px);
  }
  #panel h2 { margin: 0; font-size: 14px; letter-spacing: 0.04em; color: var(--muted); }
  #panel .row { display: flex; flex-wrap: wrap; gap: 6px; }
  #panel button {
    font: 700 13px var(--font); color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 10px; cursor: pointer;
  }
  #panel button:hover { background: rgba(255, 255, 255, 0.14); }
  #panel button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #panel label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  #panel .kbd { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  #panel .url { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }
  .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="view"></div>
<div class="hud hud-top">
  <span class="pill" id="status" data-s="demo"><i></i><span id="status-text">デモ再生中</span></span>
  <span class="pill" id="season" hidden></span>
</div>
<div class="hud toast out" id="toast"></div>
<div class="hud card dish out" id="dish-card">
  <div class="dish-title" id="dish-title">できあがり！</div>
  <div class="wait" id="dish-wait" hidden></div>
  <canvas id="dish-canvas" width="640" height="480"></canvas>
  <p id="dish-name"></p>
</div>
<div class="hud card out" id="card">
  <div class="score"><span id="score-num">0</span><small>点</small></div>
  <p id="score-comment"></p>
  <div class="note" id="score-note" hidden>デモ用の仮の点数（本番はサーバーが採点する）</div>
</div>
<button id="panel-toggle" type="button">操作パネル</button>
<aside id="panel" hidden>
  <h2>イベントを送る（サーバーの代わり）</h2>
  <div class="row">
    <button type="button" data-act="swing">振り下ろす <span class="kbd">K</span></button>
    <button type="button" data-act="cut">切る <span class="kbd">C</span></button>
    <button type="button" data-act="add">フライパンへ <span class="kbd">A</span></button>
  </div>
  <div class="row">
    <button type="button" data-act="salt">塩 <span class="kbd">S</span></button>
    <button type="button" data-act="pepper">こしょう <span class="kbd">P</span></button>
  </div>
  <div class="row" id="fire-row">
    <button type="button" data-fire="0">切 <span class="kbd">0</span></button>
    <button type="button" data-fire="1">弱 <span class="kbd">1</span></button>
    <button type="button" data-fire="2">中 <span class="kbd">2</span></button>
    <button type="button" data-fire="3">強 <span class="kbd">3</span></button>
  </div>
  <div class="row">
    <button type="button" data-act="serve">提供 <span class="kbd">Enter</span></button>
    <button type="button" data-act="reset">リセット <span class="kbd">R</span></button>
    <button type="button" data-act="demo" id="demo-btn">デモ再生 <span class="kbd">D</span></button>
  </div>
  <h2>料理の写真を試す（提供）</h2>
  <div class="row">
    <button type="button" data-dish="good">おいしい</button>
    <button type="button" data-dish="burnt">こげた</button>
    <button type="button" data-dish="undercooked">生焼け</button>
    <button type="button" data-dish="salty">しょっぱい</button>
  </div>
  <div class="row" id="view-row">
    <button type="button" id="open-guest">お客さんの画面を開く</button>
    <button type="button" id="open-kitchen">キッチンの画面にする</button>
  </div>
  <label><input type="checkbox" id="gen"> 料理の写真を画像生成で作る（サーバーの提供では自動でオン）</label>
  <label><input type="checkbox" id="mouse-knife"> マウスで包丁を動かす（クリックで振り下ろす）</label>
  <label><input type="checkbox" id="sound"> 音を出す</label>
  <div class="url">サーバー: <span id="ws-url"></span></div>
</aside>
<div class="fallback" id="fallback" hidden><p>3D を読み込めませんでした。インターネットにつながっているか確かめて、読み込み直してください。</p></div>

<script src="dishes/dishes.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { SMAAPass } from "three/addons/postprocessing/SMAAPass.js";

// =====================================================================
//  おままごとキッチンの画面（three.js の試作）
//  サーバーから要件定義書 6.4 のイベントを WebSocket で受けて、3D の演出を出す。判断はしない。
//  つながっていないときはデモを流す。座標は mm（x 右・y 上・z 手前）。天板の上面が y = 0
// =====================================================================
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const WS_URL = params.get("ws") || "ws://localhost:9000/screen";
// 料理の写真を作る中継サーバー（screen/dish_server.py）。API キーはここだけが持つ
// サーバーから開いたページなら同じサーバーの /dish、ファイルとして開いたなら localhost:9001
const DISH_URL = params.get("dish") || (location.protocol.startsWith("http") ? new URL("/dish", location.href).href : "http://localhost:9001/dish");
const DISH_WAIT = Number(params.get("dishwait")) || 45;   // 画像生成を待つ秒数。過ぎたら用意した写真を出す
$("ws-url").textContent = WS_URL;
if (params.get("panel") === "0") $("panel-toggle").hidden = true;
// 画面の種類: kitchen = キッチンだけ / guest = 食べるお客さんだけ / all = 1 画面で全部（テスト用）
const VIEW = ["kitchen", "guest"].includes(params.get("view")) ? params.get("view") : "all";
document.body.dataset.view = VIEW;
if (VIEW === "guest") $("panel-toggle").hidden = true;
document.title = { kitchen: "キッチンの画面", guest: "お客さんの画面", all: "おままごとキッチン画面" }[VIEW];
// 2 つの画面のやり取り（同じ PC・同じアドレスで開いた窓どうし）
let bus = null;
try { bus = new BroadcastChannel("omamagoto-screen"); } catch (e) { /* 使えない環境では 1 画面で使う */ }
const D0 = new THREE.Vector3(6000, 0, 0);   // お客さんの席（キッチンから離れた所に置く）
if (params.get("gen") === "1") $("gen").checked = true;

// まな板座標（0〜1）→ 画面の位置。実物のキッチンと同じ配置（設計書の P と同じ数字）
const BOARD = { x0: 90, y0: 90, w: 300, d: 220, t: 20 };
const V_FROM_FRONT = true;   // まな板座標の y = 0 が手前の縁（キャリブレーションで決める向き）
function boardToWorld(u, v, h = BOARD.t) {
  const ym = BOARD.y0 + (V_FROM_FRONT ? v : 1 - v) * BOARD.d;
  return new THREE.Vector3(BOARD.x0 + u * BOARD.w, h, -ym);
}
const PAN_C = new THREE.Vector3(900, 43, -210);      // フライパンの底の真ん中（右のバーナーの上。五徳の上面は 38.5）
const PLATE_C = new THREE.Vector3(490, 0, -180);
const SERVE_C = new THREE.Vector3(645, 0, -870);     // 料理を出す所（奥の受け渡し口）

// ---------------- レンダラー ----------------
const view = $("view");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
} catch (e) {
  $("fallback").hidden = false;
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b231d);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.5;

const camera = new THREE.PerspectiveCamera(38, 16 / 9, 10, 9000);
const CAM_POS = VIEW === "guest" ? D0.clone().add(new THREE.Vector3(0, 430, 820)) : new THREE.Vector3(525, 640, 600);
const CAM_LOOK = VIEW === "guest" ? D0.clone().add(new THREE.Vector3(0, 170, -140)) : new THREE.Vector3(525, 130, -420);
const camShake = new THREE.Vector3();

// 窓からの光（左上の奥）と、部屋の明かり
const sun = new THREE.DirectionalLight(0xfff1de, 2.6);
if (VIEW === "guest") {
  sun.position.copy(D0).add(new THREE.Vector3(-700, 1500, 700));
  sun.target.position.copy(D0);
} else {
  sun.position.set(-500, 1500, 500);
  sun.target.position.set(560, 0, -330);
}
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -1100, right: 1100, top: 1100, bottom: -1100, near: 200, far: 4200 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x6b5a4c, 0.55));
const warm = new THREE.PointLight(0xffb36b, 0.0, 900, 1.6);   // 受け渡し口の向こうの明かり
warm.position.set(645, 380, -1300);
warm.intensity = 60000;
scene.add(warm);
const fireGlow = new THREE.PointLight(0xff7a2a, 0, 420, 1.8);
fireGlow.position.copy(PAN_C).add(new THREE.Vector3(0, -14, 0));
scene.add(fireGlow);

// ---------------- 小さな道具 ----------------
function rng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function canvasTex(w, h, draw, { srgb = true, repeat } = {}) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) {
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeat[0], repeat[1]);
  }
  return t;
}
const phys = (o) => new THREE.MeshPhysicalMaterial(o);
const stdm = (o) => new THREE.MeshStandardMaterial(o);
function shadowAll(o, cast = true, recv = true) {
  o.traverse((m) => {
    if (m.isMesh) {
      m.castShadow = cast;
      m.receiveShadow = recv;
    }
  });
  return o;
}
const ease = {
  io: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
  out: (k) => 1 - Math.pow(1 - k, 3),
  in: (k) => k * k * k,
  back: (k) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2);
  },
};
const tweens = [];
function tween(dur, fn, done, delay = 0) {
  const tw = { t: -delay, dur, fn, done };
  tweens.push(tw);
  return tw;
}
function stepTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    if (tw.t < 0) continue;
    const k = Math.min(1, tw.t / tw.dur);
    tw.fn(k);
    if (k >= 1) {
      tweens.splice(i, 1);
      if (tw.done) tw.done();
    }
  }
}
const later = (sec, fn) => tween(0.0001, () => {}, fn, sec);

// ---------------- 質感（絵を描いて作る） ----------------
const stoneTex = canvasTex(1024, 1024, (g, w, h) => {
  const r = rng(7);
  g.fillStyle = "#e9e3d9";
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 26000; i++) {
    const v = 200 + r() * 50;
    g.fillStyle = `rgba(${v},${v - 6},${v - 14},${0.25 + r() * 0.35})`;
    g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2);
  }
  g.filter = "blur(2px)";
  for (let i = 0; i < 7; i++) {
    g.strokeStyle = `rgba(150,138,124,${0.08 + r() * 0.08})`;
    g.lineWidth = 1 + r() * 3;
    g.beginPath();
    let x = r() * w, y = r() * h;
    g.moveTo(x, y);
    for (let k = 0; k < 6; k++) {
      x += (r() - 0.3) * 260;
      y += (r() - 0.5) * 160;
      g.quadraticCurveTo(x - 60, y + 40, x, y);
    }
    g.stroke();
  }
  g.filter = "none";
}, { repeat: [2.2, 1] });

const woodTex = canvasTex(1024, 768, (g, w, h) => {
  const r = rng(11);
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, "#dcb27c");
  grd.addColorStop(1, "#cfa069");
  g.fillStyle = grd;
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 150; i++) {
    const y = r() * h, amp = 2 + r() * 10, per = 200 + r() * 500, ph = r() * 6;
    g.strokeStyle = `rgba(${120 + r() * 40},${70 + r() * 30},${30 + r() * 20},${0.12 + r() * 0.2})`;
    g.lineWidth = 0.6 + r() * 2.4;
    g.beginPath();
    for (let x = 0; x <= w; x += 8) g.lineTo(x, y + Math.sin(x / per * 6.28 + ph) * amp);
    g.stroke();
  }
  for (let i = 0; i < 5; i++) {   // 包丁の跡
    g.strokeStyle = "rgba(255,240,215,0.18)";
    g.lineWidth = 1;
    g.beginPath();
    const x = 250 + r() * 500, y = 200 + r() * 300;
    g.moveTo(x, y);
    g.lineTo(x + 60 + r() * 80, y + (r() - 0.5) * 40);
    g.stroke();
  }
});

function tilePainter(bump) {
  return (g, w, h) => {
    const r = rng(bump ? 3 : 3);
    const tw = w / 4, th = h / 8, gr = 6;
    g.fillStyle = bump ? "#000" : "#cbc3b6";
    g.fillRect(0, 0, w, h);
    for (let row = 0; row < 8; row++) {
      for (let col = -1; col < 5; col++) {
        const x = col * tw + (row % 2) * tw / 2, y = row * th;
        if (bump) {
          const grd = g.createLinearGradient(0, y, 0, y + th);
          grd.addColorStop(0, "#d8d8d8");
          grd.addColorStop(0.5, "#ffffff");
          grd.addColorStop(1, "#cfcfcf");
          g.fillStyle = grd;
        } else {
          const v = 240 + r() * 10;
          g.fillStyle = `rgb(${v},${v - 3},${v - 9})`;
        }
        g.beginPath();
        g.roundRect(x + gr / 2, y + gr / 2, tw - gr, th - gr, 10);
        g.fill();
      }
    }
  };
}
const tileTex = canvasTex(1024, 1024, tilePainter(false));
const tileBump = canvasTex(1024, 1024, tilePainter(true), { srgb: false });
for (const t of [tileTex, tileBump]) t.wrapS = t.wrapT = THREE.RepeatWrapping;

const carrotSkin = canvasTex(256, 512, (g, w, h) => {
  const r = rng(5);
  g.fillStyle = "#f07a22";
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    const y = r() * h;
    g.fillStyle = `rgba(${150 + r() * 60},${50 + r() * 30},10,${0.12 + r() * 0.22})`;
    g.fillRect(0, y, w, 1 + r() * 2.5);

// 写真をキャンバスに描く（キャンバスの縦横比は写真に合わせる。横長は 4:3 まで）
function drawDish(im) {
  const w = 640, h = Math.round(640 * Math.min(1, Math.max(0.75, im.naturalHeight / im.naturalWidth)));
  dishCanvas.width = w;
  dishCanvas.height = h;
  const g = dishCanvas.getContext("2d");
  g.globalCompositeOperation = "source-over";
  const s = Math.max(w / im.naturalWidth, h / im.naturalHeight);
  g.drawImage(im, (w - im.naturalWidth * s) / 2, (h - im.naturalHeight * s) / 2, im.naturalWidth * s, im.naturalHeight * s);
}
// i 口目（全部で n 口）。上から下へ、ぎざぎざの丸でかじる。最後のひと口で全部なくなる
function bite(i, n) {
  const g = dishCanvas.getContext("2d"), w = dishCanvas.width, h = dishCanvas.height;
  g.globalCompositeOperation = "destination-out";
  if (i === n - 1) {
    g.fillRect(0, 0, w, h);
    return;
  }
  const cx = w * (0.25 + 0.5 * ((i * 0.618) % 1)), cy = h * (0.1 + (0.8 * i) / Math.max(1, n - 1));
  const R = w * 0.17;
  for (let k = 0; k < 9; k++) {
    const b = (k / 9) * Math.PI * 2;
    g.beginPath();
    g.arc(cx + Math.cos(b) * R * 0.75, cy + Math.sin(b) * R * 0.75, R * (0.42 + Math.random() * 0.12), 0, Math.PI * 2);
    g.fill();
  }
  g.beginPath();
  g.arc(cx, cy, R * 0.9, 0, Math.PI * 2);
  g.fill();
}

// 受け渡し口の向こうに丸いテーブルの席が見える向き（キッチン）/ ソファの席が見える向き（お客さん）
const ROT = THREE.MathUtils.degToRad(Number(params.get("hdrirot") ?? (VIEW === "guest" ? 25 : 115)));
const texLoader2 = new THREE.TextureLoader();
function loadTex(path, srgb, rep) {
  return new Promise((ok) => texLoader2.load(ASSETS + path, (tx) => {
    if (srgb) tx.colorSpace = THREE.SRGBColorSpace;
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    if (rep) tx.repeat.set(rep[0], rep[1]);
    tx.anisotropy = renderer.capabilities.getMaxAnisotropy();
    ok(tx);
  }, undefined, () => ok(null)));
}
function loadModel(path) {
  // .gltf が読めないとき（公開ページなど）は、部品を 1 つにまとめた .gltf.json を読む
  const one = (p) => new Promise((ok) => new GLTFLoader().load(ASSETS + p, (g) => ok(g.scene), undefined, () => ok(null)));
  return one(path).then((m) => m || one(path + ".json"));
}
function useEnv(tex) {
  tex.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  scene.environmentIntensity = 0.6;
  scene.environmentRotation.y = ROT;
  scene.background = tex;
  scene.backgroundBlurriness = 0.06;
  scene.backgroundIntensity = 0.9;
  scene.backgroundRotation.y = ROT;
  room.visible = false;
  floor.visible = false;
}
// 置く: 底を y = 0 にそろえ、高さ h（mm）に合わせる。h がなければ実寸（m → mm）
function place(obj, pos, h, rotY = 0) {
  obj.scale.setScalar(1000);
  obj.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(obj);
  if (h) {
    obj.scale.multiplyScalar(h / (box.max.y - box.min.y));
    obj.updateMatrixWorld(true);
    box = new THREE.Box3().setFromObject(obj);
  }
  const c = box.getCenter(new THREE.Vector3());
  obj.rotation.y = rotY;
  const holder = new THREE.Group();
  obj.position.set(-c.x, -box.min.y, -c.z);
  holder.add(obj);
  holder.position.copy(pos);
  scene.add(shadowAll(holder));
  return holder;
}

const CAR = { L: 150, R: 21 };
function carR(t) {
  const body = CAR.R * Math.pow(Math.max(0, 1 - t), 0.78);
  const top = Math.sin(Math.min(1, t / 0.09) * Math.PI / 2);
  const ring = 1 - 0.03 * Math.pow(Math.abs(Math.sin(t * Math.PI * 15)), 10);
  return Math.max(0.7, body * (0.25 + 0.75 * top) * ring);
}
const carrotRoot = new THREE.Group();   // まな板の上の物（位置イベントでまとめて動く）

let pieces = [];

function buildPiece(t0, t1) {
  const L = CAR.L, tm = (t0 + t1) / 2, yc = L / 2 - tm * L;
  const n = Math.max(8, Math.round((t1 - t0) * 70));
  const pts = [];
  for (let i = n; i >= 0; i--) {
    const t = t0 + ((t1 - t0) * i) / n;
    pts.push(new THREE.Vector2(carR(t), L / 2 - t * L - yc));
  }
  const geo = new THREE.LatheGeometry(pts, 44);
  const uv = geo.attributes.uv, pos = geo.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setY(i, ((L / 2 - (pos.getY(i) + yc)) / L) * 2);
  const skin = phys({ map: carrotSkin, bumpMap: carrotBump, bumpScale: 0.8, roughness: 0.5, sheen: 0.4, sheenColor: new THREE.Color(0xffc48a), transparent: false });
  const inner = new THREE.Group();
  inner.rotation.z = Math.PI / 2;                 // 葉の側が -x、先が +x
  inner.add(new THREE.Mesh(geo, skin));
  const capMat = phys({ map: carrotCut, roughness: 0.38, clearcoat: 0.6, clearcoatRoughness: 0.3 });
  const mats = [skin, capMat];
  if (t0 > 0.001) {
    const c = new THREE.Mesh(new THREE.CircleGeometry(carR(t0) * 0.995, 40), capMat);
    c.rotation.x = -Math.PI / 2;
    c.position.y = L / 2 - t0 * L - yc;
    inner.add(c);
  }
  if (t1 < 0.999) {
    const c = new THREE.Mesh(new THREE.CircleGeometry(carR(t1) * 0.995, 40), capMat);
    c.rotation.x = Math.PI / 2;
    c.position.y = L / 2 - t1 * L - yc;
    inner.add(c);
  }
  if (t0 <= 0.001) {   // 葉
    const leafMat = phys({ color: 0x4c8a32, roughness: 0.55, sheen: 0.5, sheenColor: new THREE.Color(0xb6e08a) });
    mats.push(leafMat);
    const r = rng(17);
    const topY = L / 2 - yc;
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2 + r();
      const len = 55 + r() * 30;
      const sp = 10 + r() * 12;
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, topY - 2, 0),
        new THREE.Vector3(Math.cos(a) * sp * 0.5 + 4, topY + len * 0.45, Math.sin(a) * sp * 0.5),
        new THREE.Vector3(Math.cos(a) * sp + 10, topY + len, Math.sin(a) * sp),
      ]);
      inner.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 1.7, 6), leafMat));
      for (let k = 0; k < 6; k++) {
        const p = curve.getPoint(0.45 + k * 0.1);
        const lf = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 6), leafMat);
        lf.scale.set(7, 2, 3.4);
        lf.position.copy(p);
        lf.rotation.set(r() * 2, r() * 6, r() * 2);
        inner.add(lf);
      }
    }
  }
  const obj = new THREE.Group();
  obj.add(inner);
  shadowAll(obj);
  const rA = t0 <= 0.001 ? CAR.R * 0.95 : carR(t0), rB = carR(t1);
  return { obj, t0, t1, mats, skin, capMat, state: "board", cook: 0, rA, rB, len: (t1 - t0) * L };
}
function restOnBoard(p, idx, n) {
  const L = CAR.L, tm = (p.t0 + p.t1) / 2;
  const x = tm * L - L / 2 + (idx - (n - 1) / 2) * (n > 1 ? 16 : 0);
  const y = (p.rA + p.rB) / 2 * 0.96;
  const tilt = -Math.atan2(p.rA - p.rB, Math.max(8, p.len));
  return { pos: new THREE.Vector3(x, y, 0), tilt };
}
function layoutBoard(animate) {
  const on = pieces.filter((p) => p.state === "board").sort((a, b) => a.t0 - b.t0);
  on.forEach((p, i) => {
    const { pos, tilt } = restOnBoard(p, i, on.length);
    if (!animate) {
      p.obj.position.copy(pos);
      p.obj.rotation.set(0, 0, tilt);
      return;
    }
    const p0 = p.obj.position.clone(), z0 = p.obj.rotation.z;
    tween(0.35, (k) => {
      const e = ease.back(k);
      p.obj.position.lerpVectors(p0, pos, e);
      p.obj.position.y = THREE.MathUtils.lerp(p0.y, pos.y, ease.out(k)) + Math.sin(k * Math.PI) * 10;
      p.obj.rotation.z = THREE.MathUtils.lerp(z0, tilt, ease.out(k));
    });
  });
}
function resetCarrot() {
  for (const p of pieces) p.obj.removeFromParent();
  pieces = [buildPiece(0, 1)];
  carrotRoot.add(pieces[0].obj);
  layoutBoard(false);
  carrot.target.copy(boardToWorld(0.5, 0.5));
  carrotRoot.position.copy(carrot.target);
  carrot.yaw = carrot.yawT = THREE.MathUtils.degToRad(-12);
  carrotRoot.rotation.y = carrot.yaw;
  carrot.opacity = 1;
  carrot.seen = true;
  setCarrotOpacity(1);
}
function setCarrotOpacity(o) {
  carrotRoot.traverse((m) => {
    if (!m.isMesh) return;
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    for (const mt of mats) {
      mt.opacity = o;
      mt.transparent = o < 0.999;
    }
  });
  carrotRoot.visible = o > 0.01;
}
// 切る: まな板の上のピースを、合計が count 個になるまで一番大きいものから半分に分ける
function cutTo(count) {
  let total = pieces.length;
  if (count <= total) return;
  while (total < count) {
    const on = pieces.filter((p) => p.state === "board");
    if (!on.length) break;
    const big = on.reduce((a, b) => (b.t1 - b.t0 > a.t1 - a.t0 ? b : a));
    const mid = big.t0 + (big.t1 - big.t0) * (big.t0 === 0 ? 0.42 : 0.5);
    const a = buildPiece(big.t0, mid), b = buildPiece(mid, big.t1);
    for (const np of [a, b]) {
      np.obj.position.copy(big.obj.position);
      np.obj.rotation.copy(big.obj.rotation);
      carrotRoot.add(np.obj);
    }
    big.obj.removeFromParent();
    pieces.splice(pieces.indexOf(big), 1, a, b);
    total++;
    chips(carrotRoot.localToWorld(big.obj.position.clone()));
  }
  layoutBoard(true);
}

function makeGrains(color, n, size) {

  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color, size, map: grainDot, alphaTest: 0.5, sizeAttenuation: true }));
  pts.frustumCulled = false;
  scene.add(pts);
  return { pts, pos, vel: new Float32Array(n * 3), life: new Float32Array(n), n, next: 0 };
}

function emit(sys, p, v, life) {
  const i = sys.next;
  sys.next = (sys.next + 1) % sys.n;
  sys.pos.set([p.x, p.y, p.z], i * 3);
  sys.vel.set([v.x, v.y, v.z], i * 3);
  sys.life[i] = life;
}
function stepGrains(sys, dt, floorY) {
  for (let i = 0; i < sys.n; i++) {
    if (sys.life[i] <= 0) continue;
    sys.life[i] -= dt;
    sys.vel[i * 3 + 1] -= 1800 * dt;
    for (let k = 0; k < 3; k++) sys.pos[i * 3 + k] += sys.vel[i * 3 + k] * dt;
    if (sys.pos[i * 3 + 1] < floorY(sys.pos[i * 3], sys.pos[i * 3 + 2])) sys.life[i] = 0;
    if (sys.life[i] <= 0) sys.pos[i * 3 + 1] = -9999;
  }
  sys.pts.geometry.attributes.position.needsUpdate = true;
}
function chips(p) {

}

function stepSteam(dt) {
  for (const s of steam) {
    if (!s.visible) continue;
    const u = s.userData;
    u.life += dt;
    const k = u.life / u.max;
    if (k >= 1) {
      s.visible = false;
      continue;
    }
    s.position.x += u.vx * dt;
    s.position.z += u.vz * dt;
    s.position.y += (70 + 40 * k) * dt;
    const sc = (24 + 90 * k) * u.big;
    s.scale.set(sc, sc, 1);
    s.material.opacity = Math.sin(k * Math.PI) * 0.16;
  }
}

const sfx = { ctx: null, noise: null, sizzle: null };
function audioOn() {
  if (sfx.ctx) return;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  sfx.ctx = ctx;
  sfx.noise = buf;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  const hp = ctx.createBiquadFilter();
  hp.type = "highpass";
  hp.frequency.value = 2500;
  const gain = ctx.createGain();
  gain.gain.value = 0;
  src.connect(hp).connect(gain).connect(ctx.destination);
  src.start();
  sfx.sizzle = gain;
}
function noiseHit(freq, q, dur, vol, type = "bandpass") {
  if (!sfx.ctx || !$("sound").checked) return;
  const c = sfx.ctx, t = c.currentTime;
  const s = c.createBufferSource();
  s.buffer = sfx.noise;
  const f = c.createBiquadFilter();
  f.type = type;
  f.frequency.value = freq;
  f.Q.value = q;
  const g = c.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f).connect(g).connect(c.destination);
  s.start(t, Math.random());
  s.stop(t + dur + 0.05);
}
function tone(freq, dur, vol, delay = 0, type = "sine") {
  if (!sfx.ctx || !$("sound").checked) return;
  const c = sfx.ctx, t = c.currentTime + delay;
  const o = c.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t);
  o.stop(t + dur + 0.05);
}
const sound = {
  chop: () => { noiseHit(1800, 1.2, 0.09, 0.7); tone(140, 0.09, 0.4); },
  shake: () => { for (let i = 0; i < 3; i++) setTimeout(() => noiseHit(6000, 0.8, 0.04, 0.25, "highpass"), i * 70); },
  ignite: () => noiseHit(600, 0.5, 0.45, 0.5, "lowpass"),
  plop: () => tone(260, 0.12, 0.25, 0, "triangle"),
  serve: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 0.18, i * 0.11)),
};

  bites.forEach((p, i) => tween(0.35, (k) => p.obj.scale.setScalar(Math.max(0.001, 1 - ease.in(k))), () => (p.obj.visible = false),

  const dur = 0.4 + n * 0.45 + 0.4;

let ws = null, wsOK = false, retry = 1;

function connect() {
  try {
    ws = new WebSocket(WS_URL);

  };
  ws.onmessage = (e) => {

  };
  ws.onclose = () => {

  };

function resize() {
  const w = view.clientWidth, h = view.clientHeight;

  renderer.setSize(w, h);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  const aspect = w / h;
  camera.aspect = aspect;
  // 16:9 より縦長の画面では、横の見える幅を 16:9 と同じにする
  const base = 38;
  if (aspect < 16 / 9) {
    const hf = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(base / 2)) * (16 / 9));
    camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(hf / 2) / aspect));
  } else camera.fov = base;
  camera.updateProjectionMatrix();
}

// ---------------- 毎フレーム ----------------
const RAW = new THREE.Color(0xffffff), COOKED = new THREE.Color(0xb0602a), CAP_COOKED = new THREE.Color(0xd99a55);
let last = performance.now(), elapsed = 0;
const DT_CAP = Number(params.get("dtcap")) || 0.05;   // 確認用: 描画が遅い PC でも時間を進める（例 ?dtcap=0.5）
function tick(now) {
  const dt = Math.min(DT_CAP, (now - last) / 1000);
  last = now;
  update(HOLD || after > 0 ? 0 : dt);
  camera.position.copy(CAM_POS).add(camShake);
  camera.lookAt(CAM_LOOK);
  if (POST) {
    vignette.uniforms.time.value = (now % 10000) / 1000;
    composer.render();
  } else renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
function update(dt) {
  elapsed += dt;
  if (VIEW === "guest" && !guestBusy) guest.root.rotation.z = Math.sin(elapsed * 1.6) * 0.025;
  demo.step(dt);
  stepTweens(dt);
  const f = 1 - Math.exp(-dt * 14);

  // 包丁
  if (!knife.seen) {
    knife.hideAt -= dt;
    if (knife.hideAt <= 0) knife.opT = 0;
  }
  knife.opacity += (knife.opT - knife.opacity) * Math.min(1, dt * 4);
  setKnifeOpacity(knife.opacity);
  knife.root.position.x += (knife.target.x - knife.root.position.x) * f;
  knife.root.position.z += (knife.target.z - knife.root.position.z) * f;
  knife.root.position.y = BOARD.t + (46 + 2) * KNIFE_S + 30 * (1 - knife.drop);
  let dy = knife.yawT - knife.yaw;
  dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  knife.yaw += dy * f;
  knife.root.rotation.y = knife.yaw;
  knife.pivot.rotation.z = knife.chop;

  // まな板の上のにんじん
  if (!carrot.seen) {
    carrot.hideAt -= dt;
    if (carrot.hideAt <= 0 && carrot.opacity > 0) {
      carrot.opacity = Math.max(0, carrot.opacity - dt * 2);
      setCarrotOpacity(carrot.opacity);
    }
  } else if (carrot.opacity < 1) {
    carrot.opacity = Math.min(1, carrot.opacity + dt * 3);
    setCarrotOpacity(carrot.opacity);
  }
  carrotRoot.position.lerp(carrot.target, f);
  let dc = carrot.yawT - carrot.yaw;
  dc = Math.atan2(Math.sin(dc), Math.cos(dc));
  carrot.yaw += dc * f;
  carrotRoot.rotation.y = carrot.yaw;

  // 火と、焼ける
  const lv = state.fire;
  const want = [0, 0.62, 0.95, 1.3][lv];
  flames.userData.cur = (flames.userData.cur || 0) + (want - (flames.userData.cur || 0)) * Math.min(1, dt * 6);
  const fl = flames.userData.cur;
  flames.visible = fl > 0.03;
  if (flames.visible) {
    const n = flames.userData.n;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const flick = 0.82 + 0.28 * Math.sin(elapsed * 23 + i * 2.7) * Math.sin(elapsed * 7.3 + i);
      dummy.position.set(Math.cos(a) * 34, 0, Math.sin(a) * 34);
      dummy.rotation.set(0, -a, 0);
      dummy.rotateZ(-0.55);
      dummy.scale.set(1, fl * flick, 1);
      dummy.updateMatrix();
      flames.setMatrixAt(i, dummy.matrix);
    }
    flames.instanceMatrix.needsUpdate = true;
  }
  fireGlow.intensity = fl * (9000 + 2500 * Math.sin(elapsed * 17));
  const food = inPan();
  for (const p of food) {
    if (lv > 0) p.cook += dt * lv * 0.03;
    const c = Math.min(1, p.cook);
    p.skin.color.copy(RAW).lerp(COOKED, c * 0.75);
    p.skin.roughness = 0.5 - 0.22 * c;
    p.capMat.color.copy(RAW).lerp(CAP_COOKED, c);
  }
  if (lv > 0 && food.length && Math.random() < dt * (3 + lv * 5)) {
    const p = food[(Math.random() * food.length) | 0];
    puff(p.obj.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 12, 0)), 1 + lv * 0.25);
  }
  if (sfx.sizzle) sfx.sizzle.gain.value += (((lv > 0 && food.length && $("sound").checked) ? 0.05 + lv * 0.04 : 0) - sfx.sizzle.gain.value) * Math.min(1, dt * 4);

  // 調味料の容器
  for (const [key, s] of Object.entries(shakers)) {
    if (s.state !== "shaking") continue;
    s.shakeLeft -= dt;
    const w = Math.sin(elapsed * 30);
    s.obj.position.y += w * 2.4;
    if (Math.random() < dt * 60) {
      const tipW = s.obj.localToWorld(new THREE.Vector3((Math.random() - 0.5) * 14, 104, (Math.random() - 0.5) * 14));
      emit(grains[key], tipW, new THREE.Vector3((Math.random() - 0.5) * 60, -120 - Math.random() * 120, (Math.random() - 0.5) * 60), 1.2);
    }
    if (Math.random() < dt * 3) sound.shake();
    if (s.shakeLeft <= 0) {
      s.state = "back";
      arcTo(s.obj, s.home.clone(), new THREE.Quaternion(), 0.55, 60, 0, () => (s.state = "home"));
    }
  }
  stepGrains(grains.salt, dt, groundY);
  stepGrains(grains.pepper, dt, groundY);
  stepGrains(grains.chip, dt, groundY);
  stepSteam(dt);

  // 文字の表示
  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) $("toast").classList.add("out");
  }
  if (cardTimer > 0) {
    cardTimer -= dt;
    if (cardTimer <= 0) $("card").classList.add("out");
  }

}

resetCarrot();
updateSeasonPill();
demo.start();
// 確認用: ?t=秒 で、デモをその時刻まで早送りしてから表示する（&hold を付けるとそこで止める）
const ff = Number(params.get("t"));
const HOLD = params.has("hold");   // 早送りした時点で止める
if (ff > 0) for (let s = 0; s < ff; s += 1 / 30) update(1 / 30);
else connect();
// 確認用: &after=秒 … 画像生成の返事を待ってから、さらにその秒数だけ進めて止める
const after = Number(params.get("after"));
if (ff > 0 && after > 0) {
  (async () => {
    await new Promise((r) => setTimeout(r, 50));
    while (genPending) await new Promise((r) => setTimeout(r, 100));
    for (let s = 0; s < after; s += 1 / 30) {
      update(1 / 30);
      await Promise.resolve();
    }
    requestAnimationFrame(tick);
  })();
} else requestAnimationFrame(tick);
</script>
