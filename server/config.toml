# サーバーの設定（要件定義書 6.5）
# 書き換えたらサーバーを再起動する。

# デバイスの MAC アドレス → 役割（salt・pepper・pan・knob・range）
# MAC アドレスはデバイスの画面の 1 行目に出ている。設定に無いデバイスがつながると、サーバーが MAC アドレスを表示する
[roles]
"AC:27:6E:D3:5C:3C" = "salt"    # 1 台目の M5StickS3（つまみとして試すときは "knob" にする）

[season]
# 強さ 1 で 1 回振ったときに入るグラム数。強さが小さければその分少なくなる
grams_per_shake = { salt = 0.5, pepper = 0.2 }
