[package]
name = "omamagoto-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
btleplug = "0.13.5"
chrono = "0.4.45"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
toml = "1.1.8"
uuid = "1.28.0"

[dev-dependencies]
tokio-tungstenite = "0.30.0"
