; センサーデバイス共通ファームウェア（要件定義書 5.1〜5.2）
; M5StickS3 用。PlatformIO に StickS3 のボード定義がまだ無いので、
; 同じ ESP32-S3（Flash 8MB・USB 直結）の StampS3 の定義を借りる。
; 機種の判別は M5Unified が実行時に行う。

[env:m5sticks3]
platform = espressif32@7.1.3
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@0.2.23
    bblanchon/ArduinoJson@7.2.2
