<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おままごとキッチン 組み立て 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --ground: #edf1ee;
    --panel: #fafbfa;
    --chip: #eef2ef;
    --ink: #1d2622;
    --muted: #5b6862;
    --line: #d3dbd6;
    --accent: #c8452c;
    --accent-ink: #ffffff;
    --pick: #2f6fb8;
    --viewport: #e3e9e5;
    --floor: #d6ddd9;
    --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101614;
      --panel: #161e1b;
      --chip: #1e2724;
      --ink: #e4ece8;
      --muted: #9aa7a1;
      --line: #2a3531;
      --accent: #f0704f;
      --accent-ink: #1a0e0b;
      --pick: #6fa8e8;
      --viewport: #0d1311;
      --floor: #1a211e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #101614;
    --panel: #161e1b;
    --chip: #1e2724;
    --ink: #e4ece8;
    --muted: #9aa7a1;
    --line: #2a3531;
    --accent: #f0704f;
    --accent-ink: #1a0e0b;
    --pick: #6fa8e8;
    --viewport: #0d1311;
    --floor: #1a211e;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.65;
  }
  .app {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-inline: 16px;
    padding-block: 12px;
  }
  .bar { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }
  .spec { margin: 0; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; }
  .stage {
    position: relative;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--viewport);
  }
  .viewport { position: absolute; inset: 0; }
  .viewport canvas { display: block; touch-action: none; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .tools { position: absolute; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; }
  .tools-view { top: 10px; left: 10px; }
  .tools-show { top: 10px; right: 10px; justify-content: flex-end; max-width: 58%; }
  .tools button, .toggle {
    font: inherit;
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .tools button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .toggle { display: inline-flex; align-items: center; gap: 6px; user-select: none; }
  .toggle input { margin: 0; accent-color: var(--accent); }
  .hint, .legend-cams {
    position: absolute;
    left: 10px;
    margin: 0;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--muted);
    background: var(--panel);
    opacity: 0.92;
  }
  .hint { bottom: 8px; }
  .legend-cams { bottom: 34px; }
  .legend-cams b { font-weight: 700; }
  .legend-cams .c0 { color: var(--accent); }
  .legend-cams .c1 { color: #2f7d9a; }
  .panel {
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
  }
  .eyebrow { margin: 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--accent); font-variant-numeric: tabular-nums; }
  h2 { margin: 2px 0 8px; font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.35; text-wrap: balance; }
  .step-text { margin: 0; max-width: 34em; }
  .tips { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .tips li { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; }
  .tips li::before {
    content: "メモ";
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    border: 1px solid currentColor;
    border-radius: 3px;
    padding: 0 4px;
  }
  .key { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
  .key .red { color: var(--accent); font-weight: 700; }
  .nav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
  .btn {
    font: inherit;
    font-weight: 700;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); }
  .parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .parts li {
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr) auto;
    align-items: baseline;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    background: var(--chip);
  }
  .no { font-weight: 700; font-size: 15px; }
  .dims { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .picked-card { display: grid; gap: 2px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--pick); }
  .picked-card .top { display: flex; align-items: baseline; gap: 10px; }
  .picked-card .no { font-size: 20px; color: var(--pick); }
  .picked-card .nm { font-weight: 700; font-size: 16px; }
  .picked-card p { margin: 0; }
  .picked-card .sub { font-size: 12px; color: var(--muted); }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .steps button {
    width: 100%;
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 6px;
    text-align: left;
    font: inherit;
    color: var(--ink);
    background: none;
    border: 0;
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
  }
  .steps button:hover { background: var(--chip); }
  .steps .n { font-family: var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .steps button[aria-current="step"] { background: var(--chip); font-weight: 700; }
  .steps button[aria-current="step"] .n { color: var(--accent); }
  .steps button.done .t { color: var(--muted); }
  .label {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    line-height: 1.3;
    white-space: nowrap;
    padding: 1px 6px;
    border-radius: 4px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .label.new { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .fallback { margin: 0; padding: 16px; }
  @media (max-width: 860px) {
    html, body { height: auto; }
    .app { height: auto; }
    .work { grid-template-columns: 1fr; }
    .stage { height: 58vh; min-height: 320px; }
    .panel { overflow: visible; }
    .tools-show { top: 46px; left: 10px; right: 10px; max-width: none; justify-content: flex-start; }
    .nav { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 3; padding-block: 8px; background: var(--panel); }
  }
</style>

<div class="app">
  <header class="bar">
    <h1>おままごとキッチン 組み立て 3D</h1>
    <p class="spec" id="spec"></p>
  </header>
  <main class="work">
    <section class="stage" aria-label="キッチンの 3D 図">
      <div id="viewport" class="viewport"></div>
      <div class="tools tools-view" role="group" aria-label="見る向き">
        <button type="button" data-view="iso">斜め</button>
        <button type="button" data-view="front">正面</button>
        <button type="button" data-view="backiso">後ろ</button>
        <button type="button" data-view="side">横</button>
        <button type="button" data-view="top">上</button>
      </div>
      <div class="tools tools-show" role="group" aria-label="表示">
        <label class="toggle"><input type="checkbox" id="t-explode"> 分解</label>
        <label class="toggle"><input type="checkbox" id="t-labels"> 番号</label>
        <label class="toggle"><input type="checkbox" id="t-ghost" checked> 完成形をうすく</label>
        <label class="toggle"><input type="checkbox" id="t-cams"> カメラの視野</label>
        <label class="toggle"><input type="checkbox" id="t-desk" checked> 机</label>
      </div>
      <p class="legend-cams" id="legend-cams" hidden><b class="c0">赤</b> = 中央カメラ ／ <b class="c1">青</b> = 左右のカメラ</p>
      <p class="hint">ドラッグで回す ・ ホイールかピンチで拡大 ・ 右ドラッグか 2 本指で移動 ・ 板をタップで寸法</p>
    </section>
    <aside class="panel" aria-live="polite">
      <div>
        <p class="eyebrow" id="step-count"></p>
        <h2 id="step-title"></h2>
        <p class="step-text" id="step-text"></p>
        <ul class="tips" id="step-tips"></ul>
        <p class="key"><span class="red">赤い線</span>の板がこの工程で付ける部材。<span class="red">赤い矢印</span>の向きに入れる。</p>
      </div>
      <div class="nav">
        <button type="button" class="btn" id="prev">◀ 前へ</button>
        <button type="button" class="btn primary" id="next">次へ ▶</button>
      </div>
      <section id="picked" hidden>
        <h3>選んだ部材</h3>
        <div class="picked-card" id="picked-body"></div>
      </section>
      <section>
        <h3 id="parts-heading">この工程で付ける部材</h3>
        <ul class="parts" id="step-parts"></ul>
      </section>
      <section>
        <h3>工程</h3>
        <ol class="steps" id="step-list"></ol>
      </section>
    </aside>
  </main>
</div>

 下①a の穴から外に出す。","tips":["天板をのせると中に手が入らない。配線はここで済ませる","土台の中の高さは 120（底板の上から天板の下まで）","左の部屋は空き。電子レンジにスイッチを付けるときだけ線を通す"]},{"title":"天板とコンロ板をのせる","view":"iso","text":"コンロ板⑨を天板③の上の位置に合わせ、天板の裏からビスで留める。天板を土台にのせ、上から前板・側板・中仕切りへビス。後ろの縁は背板の後ろからビスで留める。","tips":["天板の後ろの縁は背板の前の面に当てる","バーナー（直径 120）と五徳は、おもちゃの部品か 3D プリントで作る"]},{"title":"袖板を立てる","view":"iso","text":"袖板⑥を天板の上の左右の端に立てる。背板の後ろから 4 枚それぞれにビスを打ち、背板の端をつなぐ。","tips":["内側の下の角は L 金具で天板に留める","前の縁は、あとで左右のカメラのアームを挟む所"]},{"title":"下の受け木","view":"backiso","text":"下の受け木⑧を縦の受けの間にはさみ、縦の受けの外側からビス 2 本ずつで留める。モニターはこの上にのる。","tips":[]},{"title":"モニターを後ろからはめる","view":"backiso","text":"後ろから、モニターを下の受け木⑧にのせ、画面を窓に押し当てる。前から見て、画面が窓の真ん中に来ているか確かめる。","tips":["モニターのケーブルは背板の後ろから、そのまま本体の後ろの PC へ"]},{"title":"押さえ桟で留める","view":"backiso","text":"モニターの背面に薄いスポンジを貼り、押さえ桟⑩を縦の受けの間の後ろの端にはさむ。外側から木ネジ 2 本ずつで留める。","tips":["運ぶときはこの木ネジ 4 本を外し、モニターを後ろに抜く"]},{"title":"中央のカメラ","view":"iso","text":"中央カメラに付いているクリップを、背板 上①b の上の縁に挟む。カメラを下に傾けて、まな板とコンロの真ん中を向ける。","tips":["カメラは水平から下に約 64° 向ける。クリップの角度が足りないときは、小さな自由雲台を足す","中央カメラの画角は 78° にする"]},{"title":"左右のカメラ","view":"iso","text":"両サイドの袖板⑥の前の縁にクランプ式の関節アームを挟み、先にカメラを付ける。左のカメラはまな板を、右のカメラはフライパンを狙う。","tips":["カメラは本体の横から 60 ほど外に出し、天板から 600 の高さにする","「カメラの視野」をオンにすると、3 台がどこを見ているかがわかる"]},{"title":"おもちゃを置いて完成","view":"iso","text":"まな板・フライパン・電子レンジ・調味料・皿を置いて完成。キッチンの前の縁を机の前の縁にそろえる。","tips":["まな板やフライパンの位置は、カメラのゾーン（キャリブレーション）と合わせる"]}],"cams":[{"name":"中央","pos":[570.0,510.0,805.0],"corners":[[1000.9,460.1,150.0],[139.1,460.1,150.0],[-68.0,-209.0,150.0],[1208.0,-209.0,150.0]]},{"name":"左","pos":[-60.0,240.0,750.0],"corners":[[108.1,506.5,150.0],[32.4,-61.2,150.0],[439.6,-211.0,150.0],[540.3,544.3,150.0]]},{"name":"右","pos":[1110.0,240.0,750.0],"corners":[[1092.1,-46.5,150.0],[1012.6,510.0,150.0],[630.4,520.5,150.0],[728.1,-163.6,150.0]]}]};

  // 設計図の座標（x 右 / y 奥 / z 上）→ three.js（x 右 / y 上 / z 手前）

  function rng(seed) {

      const y = r() * h, amp = 3 + r() * 14, per = w / (1 + Math.floor(r() * 3)), ph = r() * Math.PI * 2;

    g.textAlign = "center";
    g.textBaseline = "middle";
    const marks = [["切", -135], ["弱", -45], ["中", 45], ["強", 135]];
    for (const x of front.knobs) {
      const cx = x * s, cy = h / 2;
      for (const [t, deg] of marks) {
        const a = ((deg - 90) * Math.PI) / 180;
        g.beginPath();
        g.moveTo(cx + Math.cos(a) * 29 * s, cy + Math.sin(a) * 29 * s);
        g.lineTo(cx + Math.cos(a) * 34 * s, cy + Math.sin(a) * 34 * s);
        g.stroke();
        g.fillText(t, cx + Math.cos(a) * 45 * s, cy + Math.sin(a) * 45 * s);
      }
    }
  });

  // 画面に映すもの（本物のキッチンのイメージ）
  const screenTex = canvasTex(1024, 576, (g) => {
    const wall = g.createLinearGradient(0, 0, 0, 576);
    wall.addColorStop(0, "#f4e6cf");
    wall.addColorStop(1, "#cfa877");
    g.fillStyle = wall;
    g.fillRect(0, 0, 1024, 576);
    g.fillStyle = "#e9dcc6";
    g.fillRect(60, 110, 250, 150);
    g.fillStyle = "#b9d4c6";
    g.fillRect(74, 124, 222, 122);
    const counter = g.createLinearGradient(0, 390, 0, 576);
    counter.addColorStop(0, "#9a6a3c");
    counter.addColorStop(1, "#6f4726");
    g.fillStyle = counter;
    g.fillRect(0, 390, 1024, 186);
    g.fillStyle = "#f3e2c0";
    g.fillRect(120, 356, 330, 46);
    g.fillStyle = "#f07f22";
    g.beginPath();
    g.ellipse(285, 350, 118, 24, 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "#2b2b2b";
    g.beginPath();
    g.ellipse(740, 380, 150, 34, 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "rgba(0,0,0,0.5)";
    g.fillRect(0, 0, 1024, 70);
    g.fillStyle = "#fff";
    g.font = "bold 32px sans-serif";
    g.fillText("画面：本物のキッチン（Unity）", 28, 47);
  });

  // 床（ふちが背景に溶けるように、真ん中だけ見える）
  const floorAlpha = canvasTex(256, 256, (g, w, h) => {
    const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    r.addColorStop(0, "#ffffff");
    r.addColorStop(0.55, "#ffffff");
    r.addColorStop(1, "#000000");
    g.fillStyle = r;
    g.fillRect(0, 0, w, h);
  });
  floorAlpha.encoding = THREE.LinearEncoding;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000),
    new THREE.MeshStandardMaterial({ color: lin(0xd6ddd9), roughness: 0.95, alphaMap: floorAlpha, transparent: true, depthWrite: false }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(W / 2, -dims.desk_h, -DEP / 2);
  floor.receiveShadow = true;
  scene.add(floor);
  const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.ShadowMaterial({ opacity: 0.14 }));
  shadowFloor.rotation.x = -Math.PI / 2;
  shadowFloor.position.set(W / 2, -0.6, -DEP / 2);
  shadowFloor.receiveShadow = true;
  scene.add(shadowFloor);

  // ---------- 形を作る ----------
  const woodRnd = rng(97);
  function plyMesh(sx, sy, sz) {
    const geom = new THREE.BoxGeometry(sx, sy, sz);
    const size = [sx, sy, sz];
    const thin = size.indexOf(Math.min(sx, sy, sz));      // 合板の厚さの向き
    const faceUV = [[sz, sy], [sz, sy], [sx, sz], [sx, sz], [sx, sy], [sx, sy]];
    const faceAxis = [0, 0, 1, 1, 2, 2];
    const uv = geom.attributes.uv;
    const ou = woodRnd(), ov = woodRnd();
    const face = std(0xffffff, { map: grainTex, roughness: 0.72 });
    const edge = std(0xffffff, { map: plyTex, roughness: 0.85 });
    const mats = [];
    for (let f = 0; f < 6; f++) {
      const [uL, vL] = faceUV[f];
      const isFace = faceAxis[f] === thin;
      for (let k = 0; k < 4; k++) {
        const i = f * 4 + k, u = uv.getX(i), v = uv.getY(i);
        if (isFace) {
          if (uL >= vL) uv.setXY(i, (u * uL) / 420 + ou, (v * vL) / 420 + ov);
          else uv.setXY(i, (v * vL) / 420 + ou, (u * uL) / 420 + ov);
        } else if (Math.abs(uL - size[thin]) < 0.01) {
          uv.setXY(i, (v * vL) / 200, u);
        } else {
          uv.setXY(i, (u * uL) / 200, v);
        }
      }
      mats.push(isFace ? face : edge);
    }
    uv.needsUpdate = true;
    return new THREE.Mesh(geom, mats);
  }
  function paintMesh(sx, sy, sz, mat, frontMap) {
    const geom = new THREE.BoxGeometry(sx, sy, sz);
    if (!frontMap) return new THREE.Mesh(geom, mat);
    const f = mat.clone();
    f.color = new THREE.Color(0xffffff);
    f.map = frontMap;
    return new THREE.Mesh(geom, [mat, mat, mat, mat, f, mat]);
  }
  function roundMesh(sx, sy, sz, r, mat) {
    const rr = Math.max(0.5, Math.min(r, sx / 2 - 0.5, sy / 2 - 0.5, sz / 2 - 0.5));
    return new THREE.Mesh(new THREE.RoundedBoxGeometry(sx, sy, sz, 4, rr), mat);
  }
  function rodMesh(a, b, r, mat) {
    const d = new THREE.Vector3().subVectors(b, a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 24), mat);
    m.position.addVectors(a, b).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(UP, d.normalize());
    return m;
  }
  const boxCenter = (b) => new THREE.Vector3((b[0] + b[3]) / 2, (b[2] + b[5]) / 2, -(b[1] + b[4]) / 2);
  const boxSize = (b) => [b[3] - b[0], b[5] - b[2], b[4] - b[1]];

  const KIND = {
    mint: () => std(0x96bda9, { roughness: 0.6 }),
    stove: () => std(0x5c6260, { roughness: 0.35, metalness: 0.55 }),
    metal: () => std(0xaab1b4, { roughness: 0.4, metalness: 0.6 }),
    monitor: () => std(0x17181a, { roughness: 0.4 }),
    desk: () => std(0xf2f3f1, { roughness: 0.6 }),
    leg: () => std(0xb9bfbc, { roughness: 0.4, metalness: 0.5 }),
    board: () => std(0xf0d9ad, { roughness: 0.65 }),
    arm: () => std(0xe7e9e8, { roughness: 0.35, metalness: 0.15 }),
    clip: () => std(0x2a2c2e, { roughness: 0.5 }),
    pcb: () => std(0x1f5f8f, { roughness: 0.45 }),
    wire: () => std(0xe0782a, { roughness: 0.5 }),
    usb: () => std(0x2b2d30, { roughness: 0.55 }),
  };
  const kindMat = (k) => (KIND[k] || (() => std(0xcccccc)))();

  function knobShape(it) {
    const g = new THREE.Group();
    const wood = std(0xc9a26b, { roughness: 0.55 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(it.r, it.r * 1.06, it.h, 48), wood);
    body.rotation.x = Math.PI / 2;
    g.add(body);
    const ptr = new THREE.Mesh(new THREE.BoxGeometry(3.5, it.r * 0.85, 2), std(0x3a2a1a));
    ptr.position.set(0, it.r * 0.42, it.h / 2 + 1);
    g.add(ptr);
    g.rotation.z = (135 * Math.PI) / 180;   // 「切」の位置を指す
    return g;
  }
  function burnerShape(it) {
    const g = new THREE.Group();
    const iron = std(0x2b2c2c, { roughness: 0.6, metalness: 0.4 });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(it.r * 0.62, 5, 12, 48), iron);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 5;
    g.add(ring);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(it.r * 0.3, it.r * 0.34, 8, 32), iron);
    cap.position.y = 4;
    g.add(cap);
    for (let i = 0; i < 4; i++) {
      const a = (i * Math.PI) / 2 + Math.PI / 4;
      const p = new THREE.Mesh(new THREE.BoxGeometry(it.r * 0.55, 6, 7), iron);
      p.position.set(Math.cos(a) * it.r * 0.8, 11, Math.sin(a) * it.r * 0.8);
      p.rotation.y = -a;
      g.add(p);
    }
    return g;
  }
  function panShape(it) {
    const g = new THREE.Group();
    const r = it.r;
    const prof = [[0, 0], [r - 6, 0], [r - 1, 2], [r + 4, it.h - 2], [r + 6, it.h]].map((p) => new THREE.Vector2(p[0], p[1]));
    g.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 64), std(0x2a2c2d, { roughness: 0.45, metalness: 0.35, side: THREE.DoubleSide })));
    const dir = new THREE.Vector3(it.handle[0], 0, -it.handle[1]).normalize();
    const a = dir.clone().multiplyScalar(r + 3).setY(it.h - 6);
    const b = a.clone().add(dir.clone().multiplyScalar(45)).setY(it.h - 1);
    const c = b.clone().add(dir.clone().multiplyScalar(115)).setY(it.h + 8);
    g.add(rodMesh(a, b, 5, std(0x80868a, { metalness: 0.6, roughness: 0.35 })));
    g.add(rodMesh(b, c, 10, std(0x8a5a33, { roughness: 0.6 })));
    return g;
  }
  function carrotShape(it) {
    const g = new THREE.Group();
    const orange = std(0xf07f22, { roughness: 0.55 });
    const L1 = it.len * 0.47, L2 = it.len * 0.53 - it.gap;
    const a = new THREE.Mesh(new THREE.CylinderGeometry(it.r, it.r * 0.78, L1, 32), orange);
    a.rotation.z = Math.PI / 2;
    a.position.x = -it.len / 2 + L1 / 2;
    g.add(a);
    const b = new THREE.Mesh(new THREE.CylinderGeometry(it.r * 0.74, it.r * 0.16, L2, 32), orange);
    b.rotation.z = Math.PI / 2;
    b.position.x = -it.len / 2 + L1 + it.gap + L2 / 2;
    g.add(b);
    const leaf = std(0x3f9a4c, { roughness: 0.7 });
    for (let i = 0; i < 3; i++) {
      const l = new THREE.Mesh(new THREE.ConeGeometry(7, 42, 12), leaf);
      l.rotation.z = Math.PI / 2 + (i - 1) * 0.35;
      l.position.set(-it.len / 2 - 17, 4 + (i - 1) * 6, (i - 1) * 7);
      g.add(l);
    }
    return g;
  }
  function microwaveShape(it) {
    const [w, h, d] = boxSize(it.box);
    const g = new THREE.Group();
    g.add(roundMesh(w, h, d, 12, std(0x93bba7, { roughness: 0.55 })));
    const z = d / 2;
    const door = new THREE.Mesh(new THREE.BoxGeometry(w * 0.6, h * 0.66, 3), std(0x1d2724, { roughness: 0.15, metalness: 0.1 }));
    door.position.set(-w / 2 + 16 + w * 0.3, 0, z + 1);
    g.add(door);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(w * 0.24, h * 0.78, 3), std(0xeef2ee, { roughness: 0.6 }));
    panel.position.set(w / 2 - 14 - w * 0.12, 0, z + 1);
    g.add(panel);
    const disp = new THREE.Mesh(new THREE.BoxGeometry(w * 0.16, 14, 2), std(0x24302c, { roughness: 0.2 }));
    disp.position.set(panel.position.x, h * 0.25, z + 3);
    g.add(disp);
    for (let i = 0; i < 3; i++) {
      const btn = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 4, 20), std(0xc9a26b, { roughness: 0.5 }));
      btn.rotation.x = Math.PI / 2;
      btn.position.set(panel.position.x, h * 0.04 - i * 24, z + 4);
      g.add(btn);
    }
    const handle = new THREE.Mesh(new THREE.BoxGeometry(8, h * 0.5, 10), std(0xeef2ee, { roughness: 0.5 }));
    handle.position.set(door.position.x + w * 0.3 + 4, 0, z + 6);
    g.add(handle);
    return g;
  }
  function bottleShape(it) {
    const g = new THREE.Group();
    const bh = it.h - 22;
    const body = new THREE.Mesh(new THREE.CylinderGeometry(it.r, it.r, bh, 32), std(0xf3f3f0, { roughness: 0.3 }));
    body.position.y = bh / 2;
    g.add(body);
    const caps = [0xc0392b, 0xd39b2f, 0x7a5230];
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(it.r + 1, it.r + 1, 22, 32), std(caps[it.cap % 3], { roughness: 0.5 }));
    cap.position.y = bh + 11;
    g.add(cap);
    return g;
  }
  function plateShape(it) {
    const g = new THREE.Group();
    const mat = std(0xfafaf7, { roughness: 0.3, side: THREE.DoubleSide });
    // 皿の底は天板から 3mm 浮かせる（天板と同じ高さだと 2 つの面がちらついて模様になる）。下に高台（輪）を付ける
    const prof = [[0, 3], [it.r - 16, 3], [it.r - 8, 6], [it.r, 13], [it.r + 1, 14]].map((p) => new THREE.Vector2(p[0], p[1]));
    g.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 64), mat));
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(it.r - 24, it.r - 22, 3, 48, 1, true), mat);
    foot.position.y = 1.5;
    g.add(foot);
    return g;
  }
  function camShape(it, center) {
    const [w, h, d] = it.body;
    const dark = it.tone === "dark";
    const head = new THREE.Group();
    const body = roundMesh(w, h, d, Math.min(w, h, d) * 0.3, std(dark ? 0x2a2c2e : 0xf2f1ec, { roughness: 0.45 }));
    body.position.z = -d / 2;
    head.add(body);
    if (!dark) {
      const face = new THREE.Mesh(new THREE.BoxGeometry(w * 0.9, h * 0.78, 2), std(0x1e2022, { roughness: 0.3 }));
      face.position.z = 0.6;
      head.add(face);
    }
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(it.lens + 3, it.lens + 3, 3, 32), std(0x3a3c3e, { metalness: 0.5, roughness: 0.3 }));
    ring.rotation.x = Math.PI / 2;
    ring.position.z = 1.6;
    head.add(ring);
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(it.lens, it.lens, 2, 32), std(0x0b1016, { roughness: 0.05, metalness: 0.2 }));
    glass.rotation.x = Math.PI / 2;
    glass.position.z = 3.2;
    head.add(glass);
    const m4 = new THREE.Matrix4().lookAt(v3(it.aim), center, UP);   // +z をねらう点へ向ける
    head.quaternion.setFromRotationMatrix(m4);
    return head;
  }

  // 1 つの部材 → 位置（中心）と中身
  function build(it) {
    const sh = it.shape;
    if (sh === "box") {
      const center = boxCenter(it.box);
      const [sx, sy, sz] = boxSize(it.box);
      let mesh;
      if (it.kind === "ply") mesh = plyMesh(sx, sy, sz);
      else if (it.round) mesh = roundMesh(sx, sy, sz, it.round, kindMat(it.kind));
      else mesh = paintMesh(sx, sy, sz, kindMat(it.kind), it.face === "knobs" ? frontTex : null);
      return { center, content: mesh, edgesOf: it.round ? null : mesh.geometry, size: [sx, sy, sz] };
    }
    if (sh === "screen") {
      const b = it.box;
      const [sx, sy] = boxSize(b);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(sx, sy), new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false }));
      return { center: new THREE.Vector3((b[0] + b[3]) / 2, (b[2] + b[5]) / 2, -b[1]), content: mesh };
    }
    if (sh === "rod") {
      const a = v3(it.a), b = v3(it.b);
      const center = a.clone().add(b).multiplyScalar(0.5);
      return { center, content: rodMesh(a.sub(center), b.sub(center), it.r, kindMat(it.kind)) };
    }
    if (sh === "ball") return { center: v3(it.c), content: new THREE.Mesh(new THREE.SphereGeometry(it.r, 24, 16), kindMat(it.kind)) };
    if (sh === "microwave") return { center: boxCenter(it.box), content: microwaveShape(it), size: boxSize(it.box) };
    const center = v3(it.c);
    const make = { knob: knobShape, burner: burnerShape, pan: panShape, carrot: carrotShape, bottle: bottleShape, plate: plateShape }[sh];
    if (make) return { center, content: make(it) };
    if (sh === "cam") return { center, content: camShape(it, center) };
    return { center, content: new THREE.Mesh(new THREE.BoxGeometry(20, 20, 20), std(0xff00ff)) };
  }

  // ---------- 部材を並べる ----------
  let accentHex = 0xc8452c;
  const edgeNormal = new THREE.LineBasicMaterial({ color: lin(0x5a4630), transparent: true, opacity: 0.16 });
  const edgeNew = new THREE.LineBasicMaterial({ color: lin(accentHex) });
  const edgePick = new THREE.LineBasicMaterial({ color: lin(0x2f6fb8) });
  const ghostMat = new THREE.LineBasicMaterial({ color: lin(0x7c8a84), transparent: true, opacity: 0.22, depthWrite: false });

  const objs = [];
  for (const it of DATA.items) {
    const { center, content, edgesOf, size } = build(it);
    const group = new THREE.Group();
    group.add(content);
    const meshes = [];
    content.traverse((m) => {
      if (m.isMesh) {
        m.castShadow = it.shape !== "screen" && it.kind !== "desk";
        m.receiveShadow = it.shape !== "screen";
        meshes.push(m);
      }
    });
    let edges = null;
    if (edgesOf) {
      edges = new THREE.LineSegments(new THREE.EdgesGeometry(edgesOf), edgeNormal);
      group.add(edges);
    }
    const bb = new THREE.Box3().setFromObject(content);
    group.position.copy(center);
    scene.add(group);

    let ghost = null;
    if (it.step > 0 && size) {
      ghost = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(size[0], size[1], size[2])), ghostMat);
      ghost.position.copy(center);
      ghost.visible = false;
      scene.add(ghost);
    }

    let label = null;
    if (it.no) {
      const el = document.createElement("div");
      el.className = "label";
      el.textContent = it.no;
      label = new THREE.CSS2DObject(el);
      label.position.set(0, bb.max.y + 22, 0);
      label.visible = false;
      group.add(label);
    }

    const o = {
      it, group, meshes, edges, ghost, label,
      home: center.clone(),
      target: center.clone(),
      from: new THREE.Vector3(it.from[0], it.from[2], -it.from[1]),
      ex: it.ex ? new THREE.Vector3(it.ex[0], it.ex[2], -it.ex[1]) : null,
    };
    for (const m of meshes) m.userData.obj = o;
    objs.push(o);
  }

  function setGlow(o, on) {
    for (const m of o.meshes) {
      const mats = Array.isArray(m.material) ? m.material : [m.material];
      for (const mt of mats) {
        if (!mt.emissive) continue;
        mt.emissive.copy(on ? lin(accentHex) : new THREE.Color(0x000000));
        mt.emissiveIntensity = on ? 0.18 : 0;
      }
    }
  }

  // ---------- カメラの視野 ----------
  const frustums = new THREE.Group();
  frustums.visible = false;
  scene.add(frustums);
  function buildFrustums() {
    while (frustums.children.length) frustums.remove(frustums.children[0]);
    DATA.cams.forEach((c, i) => {
      const p = v3(c.pos);
      const cs = c.corners.map(v3);
      const col = lin(i === 0 ? accentHex : 0x2f7d9a);
      const pts = [];
      cs.forEach((q, j) => pts.push(p, q, q, cs[(j + 1) % 4]));
      frustums.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.9 })));
      const face = new THREE.BufferGeometry().setFromPoints([p, cs[0], cs[1], p, cs[1], cs[2], p, cs[2], cs[3], p, cs[3], cs[0]]);
      frustums.add(new THREE.Mesh(face, new THREE.MeshBasicMaterial({
        color: col, transparent: true, opacity: 0.08, side: THREE.DoubleSide, depthWrite: false,
      })));
    });
  }

  // ---------- 矢印（入れる向き）----------
  const arrows = new THREE.Group();
  scene.add(arrows);
  function updateArrows() {
    while (arrows.children.length) arrows.remove(arrows.children[0]);
    if (step === 0) return;
    for (const o of objs) {
      if (o.it.step !== step || o.it.noArrow || !o.group.visible) continue;
      const len = o.from.length();
      if (len < 1) continue;
      const dir = o.from.clone().multiplyScalar(-1).normalize();
      const start = o.target.clone().add(o.from.clone().multiplyScalar(1.2));
      arrows.add(new THREE.ArrowHelper(dir, start, len * 0.95, lin(accentHex), 42, 24));
    }
  }

  // ---------- 工程 ----------
  const steps = DATA.steps;
  const LAST = steps.length - 1;
  let step = 0;
  let picked = null;
  const tExplode = $("t-explode"), tLabels = $("t-labels"), tGhost = $("t-ghost"), tCams = $("t-cams"), tDesk = $("t-desk");
  const center0 = new THREE.Vector3(W / 2, 380, -DEP / 2);

  function explodeOffset(o) {
    if (o.ex) return o.ex.clone();   // 部材ごとに決めた向き（底板は動かさず、上の物ほど上へ）
    const d = o.home.clone().sub(center0);
    d.y *= 0.6;
    if (d.lengthSq() < 1) d.set(0, 1, 0);
    return d.normalize().multiplyScalar(230);
  }

  function applyState(animate) {
    const all = step === 0;
    for (const o of objs) {
      const s = o.it.step;
      const visible = s < 0 ? tDesk.checked : (all || s <= step);
      const isNew = !all && s === step;
      o.group.visible = visible;
      if (o.ghost) o.ghost.visible = !visible && tGhost.checked;
      if (o.edges) o.edges.material = o === picked ? edgePick : (isNew ? edgeNew : edgeNormal);
      setGlow(o, isNew);
      if (o.label) {
        o.label.visible = visible && (isNew || tLabels.checked);
        o.label.element.classList.toggle("new", isNew);
      }
      o.target.copy(o.home);
      if (tExplode.checked && visible && s > 0) o.target.add(explodeOffset(o));
      if (!animate || reduceMotion) o.group.position.copy(o.target);
      else if (isNew) o.group.position.copy(o.target).add(o.from);
    }
    floor.visible = tDesk.checked;
    shadowFloor.visible = !tDesk.checked;
    frustums.visible = tCams.checked;
    $("legend-cams").hidden = !tCams.checked;
    updateArrows();
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function updatePanel() {
    const st = steps[step];
    $("step-count").textContent = step === 0 ? `完成形 ・ 全 ${LAST} 工程` : `工程 ${step} / ${LAST}`;
    $("step-title").textContent = st.title;
    $("step-text").textContent = st.text;
    $("step-tips").replaceChildren(...st.tips.map((t) => el("li", "", t)));
    $("parts-heading").textContent = step === 0 ? "部材の一覧" : "この工程で付ける部材";

    const groups = new Map();
    for (const o of objs) {
      const it = o.it;
      if (it.step < 0 || it.sub) continue;
      if (step !== 0 && it.step !== step) continue;
      if (step === 0 && !it.no) continue;
      const key = it.no || it.name;
      const g = groups.get(key) || { no: it.no, name: it.name, dims: it.dims || "", n: 0 };
      g.n += 1;
      groups.set(key, g);
    }
    const rows = [...groups.values()].map((g) => {
      const li = el("li");
      li.append(el("span", "no", g.no || "・"), el("span", "nm", g.name + (g.n > 1 ? ` ×${g.n}` : "")), el("span", "dims", g.dims));
      return li;
    });
    $("step-parts").replaceChildren(...rows);

    $("prev").disabled = step === 0;
    $("next").disabled = step === LAST;
    $("next").textContent = step === 0 ? "組み立てを始める ▶" : (step === LAST ? "完成" : "次へ ▶");
    document.querySelectorAll("#step-list button").forEach((b, i) => {
      if (i === step) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
      b.classList.toggle("done", step > 0 && i > 0 && i < step);
    });
  }

  function pick(o) {
    const prev = picked;
    picked = o && o.it.step >= 0 ? o : null;
    if (prev && prev.edges) prev.edges.material = (prev.it.step === step && step !== 0) ? edgeNew : edgeNormal;
    const box = $("picked");
    if (!picked) { box.hidden = true; return; }
    if (picked.edges) picked.edges.material = edgePick;
    const it = picked.it;
    const top = el("div", "top");
    top.append(el("span", "no", it.no || "・"), el("span", "nm", it.name));
    const card = [top, el("p", "dims", it.dims || "")];
    if (it.where) card.push(el("p", "", it.where));
    if (it.step > 0) card.push(el("p", "sub", `工程 ${it.step}「${steps[it.step].title}」で付ける`));
    $("picked-body").replaceChildren(...card);
    box.hidden = false;
  }

  // ---------- 見る向き ----------
  const VIEWS = {
    iso: [-1250, 1050, 1750],
    front: [0, 280, 2500],
    backiso: [1250, 1050, -1750],
    side: [-2500, 320, 0],
    top: [0, 2700, 30],
  };
  // 「分解」のときは部材が広がるので、少し引いて、広がった真ん中（上・奥）を見る
  const EXPLODE_ZOOM = 1.3;
  const EXPLODE_SHIFT = new THREE.Vector3(0, 130, -150);
  let camAnim = null;
  function moveCamera(p1, q1, instant, dur) {
    if (instant || reduceMotion) {
      camera.position.copy(p1);
      controls.target.copy(q1);
      camAnim = null;
      return;
    }
    camAnim = { t0: performance.now(), dur, p0: camera.position.clone(), p1, q0: controls.target.clone(), q1 };
  }
  function goView(name, instant) {
    const off = VIEWS[name] || VIEWS.iso;
    const ex = tExplode.checked;
    const tgt = ex ? target0.clone().add(EXPLODE_SHIFT) : target0.clone();
    const to = tgt.clone().add(new THREE.Vector3(off[0], off[1], off[2]).multiplyScalar(ex ? EXPLODE_ZOOM : 1));
    document.querySelectorAll("[data-view]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === name)));
    moveCamera(to, tgt, instant, 750);
  }
  function reframeExplode() {   // 今の向きのまま、引く／寄る
    const on = tExplode.checked;
    const q0 = controls.target.clone();
    const q1 = on ? q0.clone().add(EXPLODE_SHIFT) : q0.clone().sub(EXPLODE_SHIFT);
    const p1 = q1.clone().add(camera.position.clone().sub(q0).multiplyScalar(on ? EXPLODE_ZOOM : 1 / EXPLODE_ZOOM));
    moveCamera(p1, q1, false, 600);
  }
  function stepCamera(now) {
    if (!camAnim) return;
    const t = Math.min(1, (now - camAnim.t0) / camAnim.dur);
    const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.q0, camAnim.q1, e);
    if (t >= 1) camAnim = null;
  }

  function go(n, instant) {
    step = Math.max(0, Math.min(LAST, n));
    pick(null);
    applyState(!instant);
    updatePanel();
    goView(steps[step].view, instant);
    try { history.replaceState(null, "", "#step" + step); } catch (e) { /* 使えない環境では何もしない */ }
  }

  // ---------- 操作 ----------
  steps.forEach((s, i) => {
    const b = el("button");
    b.type = "button";
    b.append(el("span", "n", String(i)), el("span", "t", s.title));
    b.addEventListener("click", () => go(i));
    const li = el("li");
    li.append(b);
    $("step-list").append(li);
  });
  $("prev").addEventListener("click", () => go(step - 1));
  $("next").addEventListener("click", () => go(step + 1));
  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => goView(b.dataset.view)));
  [tExplode, tLabels, tGhost, tCams, tDesk].forEach((t) => t.addEventListener("change", () => applyState(true)));
  tExplode.addEventListener("change", reframeExplode);
  document.addEventListener("keydown", (e) => {
    if (e.target && ["INPUT", "TEXTAREA"].includes(e.target.tagName)) return;
    if (e.key === "ArrowRight") go(step + 1);
    if (e.key === "ArrowLeft") go(step - 1);
  });

  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  let downAt = null;
  renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener("pointerup", (e) => {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const targets = [];
    for (const o of objs) if (o.group.visible && o.it.step >= 0) targets.push(...o.meshes);
    const hits = ray.intersectObjects(targets, false);
    pick(hits.length ? hits[0].object.userData.obj : null);
  });

  // ---------- テーマ ----------
  function readTheme() {
    const cs = getComputedStyle(document.documentElement);
    const tok = (name, fb) => cs.getPropertyValue(name).trim() || fb;
    scene.background = new THREE.Color(tok("--viewport", "#e3e9e5"));
    floor.material.color = lin(tok("--floor", "#d6ddd9"));
    accentHex = new THREE.Color(tok("--accent", "#c8452c")).getHex();
    edgeNew.color = lin(accentHex);
    edgePick.color = lin(new THREE.Color(tok("--pick", "#2f6fb8")).getHex());
    buildFrustums();
    applyState(false);
  }
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // ---------- 大きさ・描画 ----------
  function resize() {
    const w = view.clientWidth, h = view.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h);
    labeler.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(view);
  resize();

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const k = reduceMotion ? 1 : 1 - Math.exp(-dt * 6.5);
    for (const o of objs) if (o.group.visible) o.group.position.lerp(o.target, k);
    stepCamera(now);
    controls.update();
    renderer.render(scene, camera);
    labeler.render(scene, camera);
    requestAnimationFrame(tick);
  }

  const m = /^#step(\d+)$/.exec(location.hash || "");
  readTheme();
  go(m ? Number(m[1]) : 0, true);
  requestAnimationFrame(tick);
})();
</script>
